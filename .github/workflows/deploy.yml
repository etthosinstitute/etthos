name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      journal: ${{ steps.filter.outputs.journal }}
      landing: ${{ steps.filter.outputs.landing }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            journal:
              - 'apps/journal/**'
            landing:
              - 'apps/landing/**'
            shared:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

  deploy-landing-vercel:
    name: Deploy landing to Vercel
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.landing == 'true' || needs.changes.outputs.shared == 'true'

    steps:
      - name: Trigger Vercel deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_LANDING_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${DEPLOY_HOOK_URL}" ]; then
            echo "Missing secret VERCEL_LANDING_DEPLOY_HOOK_URL"
            exit 1
          fi

          curl --fail --show-error --silent -X POST "${DEPLOY_HOOK_URL}"
          echo "Landing deploy hook triggered."

  deploy-journal-oracle:
    name: Deploy journal to Oracle Cloud (SSH)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.journal == 'true' || needs.changes.outputs.shared == 'true'
    environment: production

    steps:
      - name: Validate required deployment settings
        env:
          SSH_HOST: ${{ secrets.JOURNAL_SSH_HOST }}
          SSH_USER: ${{ vars.JOURNAL_SSH_USER }}
          SSH_KEY: ${{ secrets.JOURNAL_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.JOURNAL_DEPLOY_PATH }}
        run: |
          test -n "${SSH_HOST}" || (echo "Missing secret JOURNAL_SSH_HOST" && exit 1)
          test -n "${SSH_USER}" || (echo "Missing variable JOURNAL_SSH_USER" && exit 1)
          test -n "${SSH_KEY}" || (echo "Missing secret JOURNAL_SSH_KEY" && exit 1)
          test -n "${DEPLOY_PATH}" || (echo "Missing variable JOURNAL_DEPLOY_PATH" && exit 1)

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.JOURNAL_SSH_HOST }}
          SSH_KEY: ${{ secrets.JOURNAL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.JOURNAL_SSH_HOST }}
          SSH_USER: ${{ vars.JOURNAL_SSH_USER }}
          DEPLOY_PATH: ${{ vars.JOURNAL_DEPLOY_PATH }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" bash -s <<REMOTE
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          git fetch --all --prune
          git checkout "${SHA}"
          git reset --hard "${SHA}"
          pnpm install --frozen-lockfile
          if [ -d packages/database/prisma/migrations ]; then
            pnpm --dir packages/database exec prisma migrate deploy
          else
            pnpm --dir packages/database exec prisma db push
          fi
          pnpm --filter @repo/database db:generate
          NODE_OPTIONS=--max-old-space-size=4096 pnpm --filter journal build
          pm2 reload ecosystem.config.cjs --update-env
          pm2 save
          echo "Journal deploy completed for ${SHA}"
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Post-deploy health check
        env:
          HEALTHCHECK_URL: ${{ vars.JOURNAL_HEALTHCHECK_URL }}
        run: |
          if [ -z "${HEALTHCHECK_URL}" ]; then
            echo "JOURNAL_HEALTHCHECK_URL not set, skipping health check."
            exit 0
          fi

          curl --fail --show-error --silent "${HEALTHCHECK_URL}" >/dev/null
          echo "Health check passed."
