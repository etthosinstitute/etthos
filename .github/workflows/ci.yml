name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      journal: ${{ steps.filter.outputs.journal }}
      landing: ${{ steps.filter.outputs.landing }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            journal:
              - 'apps/journal/**'
            landing:
              - 'apps/landing/**'
            shared:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

  lint-and-build:
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and build journal scope
        if: needs.changes.outputs.journal == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          pnpm turbo run lint --filter=journal...
          pnpm turbo run build --filter=journal...

      - name: Lint and build landing scope
        if: needs.changes.outputs.landing == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          pnpm turbo run lint --filter=landing...
          pnpm turbo run build --filter=landing...

      - name: No app changes
        if: needs.changes.outputs.journal != 'true' && needs.changes.outputs.landing != 'true' && needs.changes.outputs.shared != 'true'
        run: echo "No app/shared changes detected. Skipping scoped lint/build."
